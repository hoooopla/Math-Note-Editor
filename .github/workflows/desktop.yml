name: Desktop packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['main']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright browser (macOS and Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run lint
      - run: npm run test:atomic-saves
      - run: npm run test:e2e
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ runner.os }}
          path: .playwright-results
          if-no-files-found: ignore
      - run: npm run build:desktop
      - run: npm run test:desktop-server
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: math-note-editor-${{ runner.os }}
          path: release/*
          if-no-files-found: error
